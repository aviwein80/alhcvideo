name: Render brand ad

on:
  push:
  workflow_dispatch:

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Render 1920x1080 / 30 fps MP4
        run: npx remotion render BrandAd out/autumn-lake-brand-ad.mp4

      - name: Check output format
        run: |
          probe=$(npx remotion ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of csv=p=0 out/autumn-lake-brand-ad.mp4)
          echo "Rendered: $probe"
          test "$probe" = "1920,1080,30/1"
          audio=$(npx remotion ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_type -of csv=p=0 out/autumn-lake-brand-ad.mp4)
          echo "Audio stream: $audio"
          test "$audio" = "audio"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: autumn-lake-brand-ad
          path: out/autumn-lake-brand-ad.mp4
          if-no-files-found: error
